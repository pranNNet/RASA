# RASA evaluation config. Weights come from <model_save_dir>/model.pt of each model config.

data: experiments/rasa_main/dataset_config.yaml   # sample_dir, split, gamma, step_stride (truth is read at full res)
split: test
steps: 120          # rollout steps from frame 0
score_res: 128      # prediction and truth are box-averaged to this before scoring
shock:
  threshold: 0.1    # shock cell: per-cell |grad log P| above this
  band: 2           # shock band = true shock cells grown by this many cells
out_dir: results/   # one <label>.npz per model

models:
  - label: RASA
    config: experiments/rasa_main/config.yaml
  - label: RASA1
    config: experiments/rasa_main/config.yaml
