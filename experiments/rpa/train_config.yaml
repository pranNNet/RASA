# RASA training config. All values are starting guesses, to tune.
 
data:
  config: ./experiments/rpa/dataset_config.yaml   # sample_dir, split, gamma, step_stride

batch:
  size: 16   # 2-4 locally (8 GB), 8-16 on A100/A6000
  num_workers: 4
  epoch_fraction: 0.5 # each epoch draws a fresh random half of the train windows

optim:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 200
  lr_min: 1.0e-5
  grad_clip: 1.0

loss:     # L1 per level, one weighted mean
  boundary_weight: 2.0    # weight on cells next to a level boundary
  level_weight: [1, 1.5, 2]   # v1.1 T1: per-level weight, L0 first (L0 keeps ~60%+ of the loss late in rollouts)
  grad_weight: 0.5        # v1.1 A1: weight of L1 on cell-to-cell differences (full fine field). Starting guess
 
# Pushforward (K_max > 1): each batch picks K in 1..K_max, runs K-1 steps without grad, trains one step.
stage1:
  K_max: 1
  lr: 1.0e-4
  max_epochs: 200
  patience: 10       # early stopping, in epochs without val improvement
stage2:
  K_max: 4
  lr: 2.0e-4
  max_epochs: 60
  patience: 10
stage3:
  K_max: 8
  lr: 2.0e-4
  max_epochs: 60
  patience: 10

val:
  every_epochs: 1
  rollout_steps: 10

log:
  tensorboard_dir: runs/   # what to log is still being decided
  every_steps: 10
  image_every_epochs: 5
 
run:
  seed: 0
  checkpoint_dir: checkpoints/
  keep_best: val_loss      # save the checkpoint with the lowest val loss