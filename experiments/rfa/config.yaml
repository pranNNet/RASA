2# RFA model config: experiments/RASA/config.yaml (RPA) with face embed sizes, flux heads and the flux section

name: RFA
type: RFA
model_save_dir: ./experiments/rfa

refine: 
  n_levels: 3 # M levels: 0 = dx, L1 = 2dx, L2 = 4dx, ... (L{M-1} = 2^(M-1) dx)
  tol: 0.05
  dilation: 1 #w: grow L0 by w coarse cells on each side

stencil:

embed:
  N_tap: 10   # dR (4), |dR| (4), offsets (2)
  N_query: 8  # face Mach (2), Courant, level, jump across the face (4)
  scales: [0.98, 1.25, 1.25, 1.50]   # reference-shock scales: log rho, u_n/c, u_t/c, log P

attn:
  d_model: 64
  N_attn_layers: 2
  N_heads: 4
  N_hidden: 128

stencil_heads:  # flux heads (N_out = 4, payload width 24, set in rfa.py)
  N_heads: 16
  d_k: 8
  r_max: 2.0

flux:   # conservative update (shared with RFA)
  fill: minmod       # coarse-to-fine fill: minmod (limited) or bilinear (RASA/RPA upsample)
  rho_min: 1.0e-6    # floor on rho' (model units). Starting guess
  p_min: 1.0e-6      # floor on P' (model units). Starting guess

execution:
  chunk_size: 32768   # cells per network pass (null = all at once). Starting guess for 8 GB
  checkpoint: true    # recompute each chunk in backward to save memory (training only)

physics:
  gamma: 1.4
  domain:
    Lx: 1.0
    Ly: 1.0
    Nx: 256
    Ny: 256
    dt: 0.0025
  scale:
    rho_inf: 1.0
    P_inf: 1.0