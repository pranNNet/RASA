# RASA preprocessing config (splitting and loading only; levels and logs are done in the model)
raw_files:             # big solver files, in this order -> sample_000 ... sample_149
  - data/2DRiemannDataset_1.h5
  - data/2DRiemannDataset_2.h5
sample_dir: data/samples
gamma: 1.4
step_stride: 1         # model step in snapshots (snapshot = k*dt = 5 * 5e-4 = 0.0025)
split:                 # by sample index, in file order: train, then val, then test
  train: 4 #120
  val: 1 #5
  test: 1 #15
  